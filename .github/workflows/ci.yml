name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Syntax & Import Check
      run: |
        python -m py_compile luast_deob.py

    - name: Run Sample Analysis Test
      run: |
        python luast_deob.py candidates "samples/Tapping Simulator level 1.lua"
        python luast_deob.py analyze "samples/Tapping Simulator level 1.lua" -o "analysis/test_sample_l1"
